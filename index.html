<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Daily Expense Tracker</h1>
    <p>Track what you spend, one expense at a time.</p>
  </header>

  <main class="container">

    <!-- Total expenses -->
    <section class="card total-card">
      <h2>Total Expenses</h2>
      <p id="total" class="total-amount">₹0.00</p>
    </section>

    <!-- Add expense form -->
    <section class="card">
      <h2>Add Expense</h2>
      <form id="expense-form">
        <div class="form-group">
          <label for="name">Expense Name</label>
          <input type="text" id="name" placeholder="e.g. Lunch" maxlength="50" required>
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="e.g. 120" min="0.01" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Shopping">Shopping</option>
            <option value="Travel">Travel</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <p id="error" class="error"></p>
        <button type="submit" class="btn-add">Add Expense</button>
      </form>
    </section>

    <!-- Expense list -->
    <section class="card">
      <h2>All Expenses</h2>
      <p id="empty-message" class="empty">No expenses yet. Add your first one above.</p>

      <div class="table-wrapper">
        <table id="expense-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Category</th>
              <th>Date</th>
              <th class="right">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expense-list"></tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>Cloud Computing Project · Data is saved in your browser (LocalStorage)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
